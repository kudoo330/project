<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站密码设置助手</title><link rel="stylesheet" href="/style.css"><script src="/password-tool.js" defer></script></head><body class="login-page"><main class="login-card"><h1>生成网站密码哈希</h1><p class="muted">密码只在当前浏览器计算，不发送到服务端。分别为管理员和查看者生成不同的密码。</p><form id="password-form"><label>新密码（至少12位）<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>再次输入<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button type="submit">生成哈希</button></form><p id="password-error" role="alert"></p><label>生成结果（复制到Cloudflare的Secret，不是登录密码）<textarea id="password-hash" rows="5" readonly></textarea></label><button id="copy-hash" class="secondary" disabled>复制哈希</button><p class="fine">管理员Secret名：ADMIN_PASSWORD_HASH<br>查看者Secret名：VIEWER_PASSWORD_HASH<br>不要把密码或哈希发到聊天、提交到GitHub。登录网站时仍输入你自己设置的原始密码。</p></main></body></html>
