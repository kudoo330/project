<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股价对比 · 拾日研究室</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css"><script type="module" src="/comparison.js"></script></head><body><main class="simple-main"><header class="simple-header"><a class="brand" href="/comparison"><span class="brand-icon">拾</span><span>拾日研究室<small>PRICE COMPARISON</small></span></a><nav><a id="admin-home" href="/app" hidden>买入追踪</a><a id="admin-research" href="/research" hidden>K线研究 · AMD</a><button id="theme" class="secondary">切换主题</button><button id="logout" class="secondary">退出登录</button></nav></header><h1>股价对比</h1><p class="muted">选择 A 股股票和日期，比较归一化日线走势。</p><form id="research-form" class="panel form-grid"><label>股票代码（最多5只，逗号分隔）<input name="symbols" placeholder="300111.SZ,688265.SH" required></label><label>开始日期<input name="start" type="date" required></label><label>结束日期<input name="end" type="date" required></label><button type="submit">查询并比较</button></form><p class="notice">按首个共同有效收盘日归一化。缺价保留空值；未复权价格可能受除权除息影响。</p><section id="research-result" class="panel" aria-live="polite">选择股票和日期，查看日线。</section><details class="panel"><summary>账户安全设置</summary><p id="password-capability"></p><form id="password-form" class="account-form" hidden><label>当前密码<input type="password" name="current_password" autocomplete="current-password" required></label><label>新密码（至少12位）<input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button>修改密码并退出登录</button></form><p id="account-status" role="status"></p></details></main></body></html>
