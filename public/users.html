<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · 拾日研究室</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css"><script type="module" src="/users.js"></script></head><body><main class="simple-main"><header class="simple-header"><a class="brand" href="/app"><span class="brand-icon">拾</span><span>拾日研究室<small>ACCOUNT SETTINGS</small></span></a><nav><a href="/app">买入追踪</a><a href="/backtest">K线研究 · AMD</a><a href="/compare">股价对比</a><button id="theme" class="secondary">切换主题</button><button id="logout" class="secondary">退出登录</button></nav></header><h1>用户管理</h1><p class="muted">仅为你指定的人开通账户。普通用户只能访问股价对比，不能查看买入记录或 AMD 研究。</p><p id="status" role="status" aria-live="polite"></p><section class="panel"><h2>已有账户</h2><div id="accounts" class="table-wrap"></div></section><section class="panel"><h2>开通指定用户</h2><form id="create-user" class="account-form"><label>用户名<input name="username" required maxlength="80" autocomplete="off"></label><label>初始密码（至少12位）<input name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label>权限<select name="role"><option value="viewer">普通用户 · 仅股价对比</option><option value="admin">管理员 · 可查看和修改全部数据</option></select></label><button type="submit">开通账户</button></form></section><dialog id="edit-user"><form class="account-form"><h2>修改账户</h2><p id="edit-name"></p><label>权限<select name="role"><option value="viewer">普通用户 · 仅股价对比</option><option value="admin">管理员 · 全部数据</option></select></label><label>状态<select name="status"><option value="active">启用</option><option value="disabled">停用</option></select></label><label>重置密码（留空保持原密码）<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password"></label><label>修改原因<input name="reason" required maxlength="500"></label><p>保存后，该用户已有登录会话将失效。</p><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="cancel-edit" class="secondary">取消</button><button type="submit">保存修改</button></div></form></dialog></main></body></html>
